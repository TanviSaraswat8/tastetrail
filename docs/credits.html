<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo credits – TasteTrail</title>
  <meta name="theme-color" content="#f2622e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TasteTrail">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="container" id="page">
    <h1 style="margin-top:18px">Photo credits</h1>
    <p class="small muted" style="margin:6px 0 16px">Dish photos come from Wikimedia Commons and are used under their free licences (Creative Commons, CC0 or public domain). Click a photo to open its source page.</p>
    <div class="card scroll-x"><table class="tbl" id="credits"></table></div>
  </main>
  <script src="js/mock-api.js"></script>
  <script src="js/dish-images.js"></script>
  <script src="js/app.js"></script>
  <script>
    const rows = Object.entries(DISH_IMAGES).map(([slug, [file, author, lic]]) => {
      const name = slug.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      return `<tr><td><a href="${dishPageUrl(file)}" target="_blank" rel="noopener">${dishPic({ name: name, emoji: '🍽️' }, 44)}</a></td>
        <td><b>${esc(name)}</b></td><td class="small">${esc(author)}</td><td class="small">${esc(lic)}</td>
        <td class="xs"><a href="${dishPageUrl(file)}" target="_blank" rel="noopener">${esc(file)}</a></td></tr>`;
    });
    document.getElementById('credits').innerHTML = '<thead><tr><th></th><th>Dish</th><th>Photo by</th><th>Licence</th><th>Source file</th></tr></thead><tbody>' + rows.join('') + '</tbody>';
  </script>
</body>
</html>
